<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Counter</title>
</head>
<body class="bdy">
    <div class="counter">
        <div id="header">
            <h1 id="heading">Counter</h1>
            <h2 id="num">0</h2>
        </div>
        <div id="btns">
            <button class="btn" id="increment">Increase</button>
            <button class="btn" id="decrement">Decrease</button>
            <button class="btn" id="reset">Reset</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
